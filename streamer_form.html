<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Заявка на Стримера - Lycoris</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Londrina+Solid:wght@400;900&display=swap" rel="stylesheet">

    <style>
        body {
            background-color: #3C3838; 
            color: #DB2222;            
            font-family: 'Londrina Solid', sans-serif; 
            padding: 20px;
            padding-top: 120px;       
            margin: 0;
            min-height: 100vh;
            position: relative;
            box-sizing: border-box;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url("https://cdn.discordapp.com/attachments/1494331191766024303/1511119351162601575/tumblr_dd13ba214a85cab0ce8c4d7fa7d3c180_d1349754_2048.gif?ex=6a1f4b10&is=6a1df990&hm=5897e704263002536c512ef7b6e32fd6c3e2d906553b70b91f8230b8ff3492da&");
            background-size: cover;       
            background-position: center;  
            filter: blur(3px);            
            z-index: -1;                  
            opacity: 0.4;                 
        }

        .navbar {
            position: fixed;             
            top: 20px;                   
            left: 50%;
            transform: translateX(-50%); 
            width: 70%;                  
            max-width: 1000px;           
            background-color: rgba(0, 0, 0, 0.6); 
            backdrop-filter: blur(5px);   
            border-radius: 15px;         
            padding: 12px 35px;          
            display: flex;               
            justify-content: space-between; 
            align-items: center;         
            box-sizing: border-box;
            border: 1px solid rgba(212, 49, 49, 0.2); 
            z-index: 100;                
        }

        .logo {
            font-size: 2rem;
            font-weight: 900;
            letter-spacing: 1px;
            color: #DB2222;            
            text-decoration: none;     
            transition: all 0.2s ease; 
        }

        .logo:hover {
            text-shadow: 0 0 10px #DB2222;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 10px; 
        }

        .nav-links a, .dropbtn {
            color: #D43131;
            text-decoration: none;       
            font-size: 1.4rem;
            transition: all 0.2s ease;   
            padding: 6px 12px;
            border-radius: 8px;
            background: none;
            border: none;
            font-family: inherit;
            cursor: pointer;
        }

        .nav-links a:hover, .dropdown:hover .dropbtn {
            background-color: #D43131;   
            color: black;                
        }

        .dropdown {
            position: relative;
            display: inline-block;
        }

        .dropdown-content {
            display: none; 
            position: absolute;
            background-color: rgba(0, 0, 0, 0.95); 
            backdrop-filter: blur(5px);
            min-width: 220px; 
            box-shadow: 0 0 15px rgba(219, 34, 34, 0.3);
            border-radius: 10px;
            border: 1px solid rgba(219, 34, 34, 0.5);
            z-index: 102; 
            top: 100%; 
            left: 50%;                 
            transform: translateX(-50%);
            padding: 0;                 
            overflow: hidden;           
        }

        .dropdown:hover .dropdown-content {
            display: block;
        }

        .dropdown-content a {
            color: #D43131;
            padding: 14px 15px;        
            text-decoration: none;
            display: block;
            text-align: center;        
            font-size: 1.2rem;
            border-radius: 0; 
            transition: background 0.2s, color 0.2s;
        }

        .dropdown-content a:hover {
            background-color: #D43131;
            color: black;
        }

        /* КОНТЕЙНЕР ДЛЯ ФОРМЫ */
        .form-container {
            max-width: 500px;
            margin: 0 auto;
            background-color: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(5px);
            border: 2px solid #DB2222;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 0 20px rgba(219, 34, 34, 0.2);
            box-sizing: border-box;
        }

        .form-container h2 {
            text-align: center;
            margin-top: 0;
            margin-bottom: 25px;
            font-size: 1.8rem;
            font-weight: 900;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(219, 34, 34, 0.5);
        }

        .form-group {
            margin-bottom: 18px;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-size: 1.15rem;
            font-weight: 900;
            margin-bottom: 6px;
            letter-spacing: 0.5px;
            color: #DB2222;
        }

        /* ПОЛЯ ВВОДА */
        .form-group input, .form-group textarea {
            width: 100%;
            background-color: rgba(34, 31, 31, 0.8);
            border: 1.5px solid rgba(219, 34, 34, 0.5);
            border-radius: 8px;
            padding: 10px 12px;
            font-family: inherit;
            font-size: 1.1rem;
            color: #fff;
            box-sizing: border-box;
            transition: all 0.2s ease;
        }

        /* Красивое неоновое свечение по фокусу */
        .form-group input:focus, .form-group textarea:focus {
            outline: none;
            border-color: #DB2222;
            box-shadow: 0 0 12px #DB2222;
            background-color: rgba(0, 0, 0, 0.9);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        /* КНОПКА ОТПРАВКИ */
        .submit-btn {
            width: 100%;
            background-color: #DB2222;
            color: black;
            border: 2px solid #DB2222;
            padding: 12px;
            font-size: 1.3rem;
            font-weight: 900;
            border-radius: 10px;
            cursor: pointer;
            font-family: inherit;
            letter-spacing: 1px;
            transition: all 0.2s ease;
            margin-top: 10px;
        }

        .submit-btn:hover {
            background-color: transparent;
            color: #DB2222;
            box-shadow: 0 0 20px #DB2222;
        }

        @media (max-width: 500px) {
            body {
                padding: 15px;
                padding-top: 95px;
            }
            .navbar {
                width: 90%;
            }
            .form-container {
                padding: 20px;
            }
            .nav-links a, .dropbtn {
                font-size: 1.1rem; 
                padding: 4px 8px;
            }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="My_syte.html" class="logo">Lycoris</a>
        
        <div class="nav-links">
            <div class="dropdown">
                <a href="My_syte.html" class="dropbtn">Главная</a>
                <div class="dropdown-content">
                    <a href="https://www.donationalerts.com/r/go_invo" target="_blank" rel="noopener noreferrer">Снять бан</a>
                    <a href="https://www.donationalerts.com/r/go_invo" target="_blank" rel="noopener noreferrer">Поддержать автора</a>
                </div>
            </div>
            
            <a href="rules.html">Правила</a>
            <a href="news.html">Новости</a>
            <a href="support.html">Поддержка</a>
        </div>
    </nav>

    <div class="form-container">
        <h2>АНКЕТА СТРИМЕРА</h2>
        
        <form action="#" method="POST">
            <div class="form-group">
                <label for="name">ИМЯ</label>
                <input type="text" id="name" name="name" required placeholder="Ваше имя">
            </div>

            <div class="form-group">
                <label for="mc_nick">НИК В МАЙНКРАФТЕ</label>
                <input type="text" id="mc_nick" name="mc_nick" required placeholder="Steve_Mine">
            </div>

            <div class="form-group">
                <label for="twitch_nick">НИК НА ТВИЧЕ</label>
                <input type="text" id="twitch_nick" name="twitch_nick" required placeholder="Ссылка или никнейм">
            </div>

            <div class="form-group">
                <label for="followers">СКОЛЬКО ФОЛЛОВЕРОВ?</label>
                <input type="number" id="followers" name="followers" min="0" required placeholder="0">
            </div>

            <div class="form-group">
                <label for="average_online">СРЕДНИЙ ОНЛАЙН</label>
                <input type="number" id="average_online" name="average_online" min="0" required placeholder="0">
            </div>

            <div class="form-group">
                <label for="age">СКОЛЬКО ЛЕТ?</label>
                <input type="number" id="age" name="age" min="0" required placeholder="Ваш возраст">
            </div>

            <div class="form-group">
                <label for="about">ЧТО ВАС ПРИВЛЕКЛО В НАС?</label>
                <textarea id="about" name="about" required placeholder="Расскажите немного о ваших мыслях..."></textarea>
            </div>

            <button type="submit" class="submit-btn">ОТПРАВИТЬ ЗАЯВКУ</button>
        </form>
    </div>

</body>
</html>
